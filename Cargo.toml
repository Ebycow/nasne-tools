[workspace]
members = ["crates/core", "crates/cli", "crates/gui", "crates/mcp"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
nasne-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
